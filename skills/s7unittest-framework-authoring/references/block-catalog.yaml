schemaVersion: "1.0.0"
skillVersion: "1.1.1"
frameworkVersion: "2.0.0"
contractVersions:
  general-framework-contract: "1.0.0"
  run-control-contract: "1.0.0"
  test-suite-contract: "1.0.0"
  test-case-contract: "1.0.0"
  event-stream-model-contract: "1.0.0"
integrationExamples:
  - blockName: "ConfigureUnitTests"
    purpose: "Optional project configuration example. Adapt values and registered Suites to the consuming application, or configure them in another project-owned location."
  - blockName: "ExecuteUnitTests"
    purpose: "Optional application-entry example. Its concrete RunControl call is commented out in the delivered source and requires explicit project binding; importing it unchanged does not execute the hierarchy. Startup initialization and cyclic execution may instead be integrated directly in the application."
blocks:
  - blockName: "InitializeUnitTestEventBuffer"
    blockType: "FC"
    category: "logging"
    levels:
      - "run-control"
    support: "required-by-pattern"
    purpose: "Initializes the producer-owned UnitTest EventBuffer FIFO control without clearing event or status data."
    useWhen:
      - "Initializing the EventBuffer at PLC startup before normal hierarchy execution."
    constraints:
      - "Parameterless Void service; call through the application startup path, not as a Test Case fixture reset."
      - "Does not clear event or status data and is not the destructive BufferCmd.Reset operation."
    interface: []
    contractRequirements: []
  - blockName: "IsEventBufferValid"
    blockType: "FC"
    category: "logging"
    levels:
      - "run-control"
    support: "required-by-pattern"
    purpose: "Returns TRUE when the producer-owned EventBuffer FIFO configuration and indices are valid."
    useWhen:
      - "Including EventBuffer validity in the Run Control configuration-error condition without direct storage access."
    constraints:
      - "Parameterless read-only projection of ConfigError and IndexError; not a capacity or reservation query."
    interface:
      - name: "ReturnValue"
        section: "return"
        dataType: "Bool"
        purpose: "NOT FifoControl.ConfigError AND NOT FifoControl.IndexError."
    contractRequirements: []
  - blockName: "CreateUnitTestFrameworkEvent"
    blockType: "FC"
    category: "event"
    levels:
      - "run-control"
      - "test-suite"
      - "test-case"
    support: "optional"
    purpose: "Creates a framework-owned UnitTest event."
    useWhen:
      - "Implementing owner events or direct lifecycle behavior without duplicating finalization events."
    constraints:
      - "Use the semantic owner scope and hierarchical name required by the event-stream contract."
    interface:
      - name: "Name"
        section: "input"
        dataType: "String"
        purpose: "Framework event name."
      - name: "State"
        section: "input"
        dataType: "Int"
        purpose: "Related framework state value."
      - name: "Severity"
        section: "input"
        dataType: "USInt"
        purpose: "Logging-domain severity classification."
      - name: "Message"
        section: "input"
        dataType: "String"
        purpose: "Human-readable framework message."
      - name: "ReturnValue"
        section: "return"
        dataType: "Int"
        purpose: "Creates a framework-owned UnitTest event."
    contractRequirements:
      - "GFC-037"
  - blockName: "CreateUnitTestStateTransitionEvent"
    blockType: "FC"
    category: "event"
    levels:
      - "run-control"
      - "test-suite"
      - "test-case"
    support: "optional"
    purpose: "Creates a standardized UnitTest state-transition event."
    useWhen:
      - "Implementing owner events or direct lifecycle behavior without duplicating finalization events."
    constraints:
      - "Use the semantic owner scope and hierarchical name required by the event-stream contract."
    interface:
      - name: "OwnerScope"
        section: "input"
        dataType: "USInt"
        purpose: "Event owner classification."
      - name: "Name"
        section: "input"
        dataType: "String"
        purpose: "Hierarchical owner/event name."
      - name: "ResourceName"
        section: "input"
        dataType: "String"
        purpose: "Tested resource context."
      - name: "StateOld"
        section: "input"
        dataType: "Int"
        purpose: "Previous owner state."
      - name: "StateNew"
        section: "input"
        dataType: "Int"
        purpose: "New owner state."
      - name: "ReturnValue"
        section: "return"
        dataType: "Int"
        purpose: "Creates a standardized UnitTest state-transition event."
    contractRequirements:
      - "GFC-039"
  - blockName: "CreateUnitTestAbortEvent"
    blockType: "FC"
    category: "event"
    levels:
      - "run-control"
      - "test-suite"
      - "test-case"
    support: "optional"
    purpose: "Creates a standardized UnitTest abort event."
    useWhen:
      - "Implementing owner events or direct lifecycle behavior without duplicating finalization events."
    constraints:
      - "Use the semantic owner scope and hierarchical name required by the event-stream contract."
    interface:
      - name: "OwnerScope"
        section: "input"
        dataType: "USInt"
        purpose: "Event owner classification."
      - name: "Name"
        section: "input"
        dataType: "String"
        purpose: "Hierarchical owner/event name."
      - name: "ResourceName"
        section: "input"
        dataType: "String"
        purpose: "Tested resource context."
      - name: "State"
        section: "input"
        dataType: "Int"
        purpose: "Owner state value."
      - name: "ReturnValue"
        section: "return"
        dataType: "Int"
        purpose: "Creates a standardized UnitTest abort event."
    contractRequirements:
      - "GFC-038"
  - blockName: "CreateUnitTestResetEvent"
    blockType: "FC"
    category: "event"
    levels:
      - "run-control"
      - "test-suite"
      - "test-case"
    support: "optional"
    purpose: "Creates a standardized UnitTest reset event."
    useWhen:
      - "Implementing owner events or direct lifecycle behavior without duplicating finalization events."
    constraints:
      - "Use the semantic owner scope and hierarchical name required by the event-stream contract."
    interface:
      - name: "OwnerScope"
        section: "input"
        dataType: "USInt"
        purpose: "Event owner classification."
      - name: "Name"
        section: "input"
        dataType: "String"
        purpose: "Hierarchical owner/event name."
      - name: "ResourceName"
        section: "input"
        dataType: "String"
        purpose: "Tested resource context."
      - name: "State"
        section: "input"
        dataType: "Int"
        purpose: "Owner state value."
      - name: "ReturnValue"
        section: "return"
        dataType: "Int"
        purpose: "Creates a standardized UnitTest reset event."
    contractRequirements:
      - "GFC-038"
  - blockName: "CreateUnitTestStartEvent"
    blockType: "FC"
    category: "event"
    levels:
      - "run-control"
      - "test-suite"
      - "test-case"
    support: "optional"
    purpose: "Creates a standardized UnitTest start event."
    useWhen:
      - "Implementing owner events or direct lifecycle behavior without duplicating finalization events."
    constraints:
      - "Use the semantic owner scope and hierarchical name required by the event-stream contract."
    interface:
      - name: "OwnerScope"
        section: "input"
        dataType: "USInt"
        purpose: "Event owner classification."
      - name: "Name"
        section: "input"
        dataType: "String"
        purpose: "Hierarchical owner/event name."
      - name: "ResourceName"
        section: "input"
        dataType: "String"
        purpose: "Tested resource context."
      - name: "State"
        section: "input"
        dataType: "Int"
        purpose: "Owner state value."
      - name: "ReturnValue"
        section: "return"
        dataType: "Int"
        purpose: "Creates a standardized UnitTest start event."
    contractRequirements:
      - "GFC-038"
  - blockName: "UpdateUnitTestEventBufferContractInfo"
    blockType: "FC"
    category: "logging"
    levels:
      - "run-control"
      - "test-suite"
      - "test-case"
    support: "required-by-pattern"
    purpose: "Updates the event-buffer contract metadata without exposing the buffer storage path to callers."
    useWhen:
      - "Integrating producer-owned event-buffer handling into Run Control execution."
    constraints: []
    interface:
      - name: "ContractInfo"
        section: "input"
        dataType: "\"UDT_UnitTestContractInfo\""
        purpose: "Current producer contract metadata."
    contractRequirements: []
  - blockName: "UnitTestSuiteOrchestrator_Parallel"
    blockType: "FB"
    category: "orchestrator"
    levels:
      - "run-control"
    support: "preferred"
    purpose: "Generic orchestration that starts all registered suite instances in parallel."
    useWhen:
      - "Implementing the preferred subordinate execution model without duplicating orchestration logic."
    constraints:
      - "Call once per PLC cycle before the concrete subordinate instance calls it controls."
      - "Keep lifecycle signals visible as static owner data and update them before the call."
      - "Result reports technical execution; successful orchestration remains Passed even when child Suites have functional Failed results. Run Control aggregates those child results."
    interface:
      - name: "CycleTime"
        section: "input"
        dataType: "DInt"
        purpose: "Current PLC cycle time in ms."
      - name: "Name"
        section: "input"
        dataType: "String"
        purpose: "Owning run-control name for generic lifecycle events."
      - name: "SuiteCount"
        section: "input"
        dataType: "UInt"
        purpose: "Number of registered suite instances to orchestrate."
      - name: "CmdData"
        section: "input"
        dataType: "\"UDT_UnitTestCommand\""
        purpose: "Suite orchestration command coupling data."
      - name: "LifecycleSignals"
        section: "input"
        dataType: "\"UDT_UnitTestLifecycleSignals\""
        purpose: "Aggregated subordinate suite lifecycle signals."
      - name: "ConfigError"
        section: "output"
        dataType: "Bool"
        purpose: "TRUE when suite orchestration configuration is invalid."
      - name: "State"
        section: "output"
        dataType: "Int"
        purpose: "Current orchestrator state-machine value."
      - name: "PreviousState"
        section: "output"
        dataType: "Int"
        purpose: "Orchestrator state before the current cycle update."
      - name: "Result"
        section: "output"
        dataType: "Int"
        purpose: "Technical orchestration result; functional Suite Failed results are aggregated by Run Control."
      - name: "Runtime"
        section: "output"
        dataType: "DInt"
        purpose: "Suite orchestration runtime in ms."
      - name: "SuiteConfigData"
        section: "in-out"
        dataType: "Array[*] of \"UDT_UnitTestSuiteConfig\""
        purpose: "Registered suite configurations."
      - name: "SuiteControlData"
        section: "in-out"
        dataType: "Array[*] of \"UDT_UnitTestSuiteControl\""
        purpose: "Registered suite command/status data."
    contractRequirements:
      - "RCC-012"
      - "RCC-017"
      - "RCC-024"
  - blockName: "UnitTestSuiteOrchestrator_ParallelSlots"
    blockType: "FB"
    category: "orchestrator"
    levels:
      - "run-control"
    support: "preferred"
    purpose: "Generic orchestration that starts suites in slot-based parallel execution slots."
    useWhen:
      - "Implementing the preferred subordinate execution model without duplicating orchestration logic."
    constraints:
      - "Call once per PLC cycle before the concrete subordinate instance calls it controls."
      - "Keep lifecycle signals visible as static owner data and update them before the call."
      - "Result reports technical execution; successful orchestration remains Passed even when child Suites have functional Failed results. Run Control aggregates those child results."
    interface:
      - name: "CycleTime"
        section: "input"
        dataType: "DInt"
        purpose: "Current PLC cycle time in ms."
      - name: "Name"
        section: "input"
        dataType: "String"
        purpose: "Owning run-control name for generic lifecycle events."
      - name: "SuiteCount"
        section: "input"
        dataType: "UInt"
        purpose: "Number of registered suite instances to orchestrate."
      - name: "CmdData"
        section: "input"
        dataType: "\"UDT_UnitTestCommand\""
        purpose: "Suite orchestration command coupling data."
      - name: "LifecycleSignals"
        section: "input"
        dataType: "\"UDT_UnitTestLifecycleSignals\""
        purpose: "Aggregated subordinate suite lifecycle signals."
      - name: "ConfigError"
        section: "output"
        dataType: "Bool"
        purpose: "TRUE when suite or slot orchestration configuration is invalid."
      - name: "State"
        section: "output"
        dataType: "Int"
        purpose: "Current orchestrator state-machine value."
      - name: "PreviousState"
        section: "output"
        dataType: "Int"
        purpose: "Orchestrator state before the current cycle update."
      - name: "Result"
        section: "output"
        dataType: "Int"
        purpose: "Technical orchestration result; functional Suite Failed results are aggregated by Run Control."
      - name: "Runtime"
        section: "output"
        dataType: "DInt"
        purpose: "Suite orchestration runtime in ms."
      - name: "SuiteConfigData"
        section: "in-out"
        dataType: "Array[*] of \"UDT_UnitTestSuiteConfig\""
        purpose: "Registered suite configurations."
      - name: "SuiteControlData"
        section: "in-out"
        dataType: "Array[*] of \"UDT_UnitTestSuiteControl\""
        purpose: "Registered suite command/status data."
      - name: "SuiteExecutionSlot"
        section: "in-out"
        dataType: "Array[*] of UInt"
        purpose: "Parallel execution slot per registered suite."
    contractRequirements:
      - "RCC-012"
      - "RCC-017"
      - "RCC-024"
  - blockName: "UnitTestSuiteOrchestrator_Serial"
    blockType: "FB"
    category: "orchestrator"
    levels:
      - "run-control"
    support: "preferred"
    purpose: "Generic serial suite orchestration without project-specific suite instance calls."
    useWhen:
      - "Implementing the preferred subordinate execution model without duplicating orchestration logic."
    constraints:
      - "Call once per PLC cycle before the concrete subordinate instance calls it controls."
      - "Keep lifecycle signals visible as static owner data and update them before the call."
      - "Result reports technical execution; successful orchestration remains Passed even when child Suites have functional Failed results. Run Control aggregates those child results."
    interface:
      - name: "CycleTime"
        section: "input"
        dataType: "DInt"
        purpose: "Current PLC cycle time in ms."
      - name: "Name"
        section: "input"
        dataType: "String"
        purpose: "Owning run-control name for generic lifecycle events."
      - name: "SuiteCount"
        section: "input"
        dataType: "UInt"
        purpose: "Number of registered suite instances to orchestrate."
      - name: "CmdData"
        section: "input"
        dataType: "\"UDT_UnitTestCommand\""
        purpose: "Suite orchestration command coupling data."
      - name: "LifecycleSignals"
        section: "input"
        dataType: "\"UDT_UnitTestLifecycleSignals\""
        purpose: "Aggregated subordinate suite lifecycle signals."
      - name: "ConfigError"
        section: "output"
        dataType: "Bool"
        purpose: "TRUE when suite orchestration configuration is invalid."
      - name: "State"
        section: "output"
        dataType: "Int"
        purpose: "Current orchestrator state-machine value."
      - name: "PreviousState"
        section: "output"
        dataType: "Int"
        purpose: "Orchestrator state before the current cycle update."
      - name: "Result"
        section: "output"
        dataType: "Int"
        purpose: "Technical orchestration result; functional Suite Failed results are aggregated by Run Control."
      - name: "Runtime"
        section: "output"
        dataType: "DInt"
        purpose: "Suite orchestration runtime in ms."
      - name: "SuiteConfigData"
        section: "in-out"
        dataType: "Array[*] of \"UDT_UnitTestSuiteConfig\""
        purpose: "Registered suite configurations."
      - name: "SuiteControlData"
        section: "in-out"
        dataType: "Array[*] of \"UDT_UnitTestSuiteControl\""
        purpose: "Registered suite command/status data."
    contractRequirements:
      - "RCC-012"
      - "RCC-017"
      - "RCC-024"
  - blockName: "UnitTestRunControlSequencer"
    blockType: "FB"
    category: "sequencer"
    levels:
      - "run-control"
    support: "preferred"
    purpose: "Generic Run Control lifecycle sequencer with lifecycle event ownership and subordinate command generation."
    useWhen:
      - "Implementing the preferred generic lifecycle for the owning framework level."
    constraints:
      - "Call once per PLC cycle before subordinate blocks controlled by CmdSubordinate."
      - "Prepare configuration, commands, and lifecycle signals before the call; evaluate outputs after the call."
      - "Pass initialized persistent OrchestratorState and OrchestratorResult from the same previous call; refresh those fields from the Orchestrator later in the cycle."
      - "Regular completion requires completed children and OrchestratorState = UnitTest.State.Completed; keep raw child lifecycle signals independent of helper completion. Reset, Abort, error and timeout exits retain their separate conditions."
    interface:
      - name: "CycleTime"
        section: "input"
        dataType: "DInt"
        purpose: "Current PLC cycle time in ms."
      - name: "Name"
        section: "input"
        dataType: "String"
        purpose: "Owning run-control name for generic lifecycle events."
      - name: "CmdData"
        section: "in-out"
        dataType: "\"UDT_UnitTestCommand\""
        purpose: "Command data from the owning run-control data, including command acknowledgement after processing."
      - name: "ConfigData"
        section: "input"
        dataType: "\"UDT_UnitTestRunConfig\""
        purpose: "Active run-control configuration input."
      - name: "LifecycleSignals"
        section: "input"
        dataType: "\"UDT_UnitTestLifecycleSignals\""
        purpose: "Aggregated subordinate suite lifecycle signals."
      - name: "OrchestratorState"
        section: "input"
        dataType: "Int"
        purpose: "Orchestrator state retained from the preceding call; Completed is required for regular owner completion."
      - name: "OrchestratorResult"
        section: "input"
        dataType: "Int"
        purpose: "Previous-call technical Suite Orchestrator result paired with OrchestratorState."
      - name: "ConfigError"
        section: "output"
        dataType: "Bool"
        purpose: "TRUE when run-control configuration is invalid."
      - name: "State"
        section: "output"
        dataType: "Int"
        purpose: "Current sequencer lifecycle state."
      - name: "PreviousState"
        section: "output"
        dataType: "Int"
        purpose: "Sequencer state before the current cycle update."
      - name: "Result"
        section: "output"
        dataType: "Int"
        purpose: "Current sequencer lifecycle result."
      - name: "CmdSubordinate"
        section: "output"
        dataType: "\"UDT_UnitTestCommand\""
        purpose: "Command data for the subordinate run-control execution layer."
      - name: "Runtime"
        section: "output"
        dataType: "DInt"
        purpose: "Runtime of the current execution phase in ms."
      - name: "StateRuntime"
        section: "output"
        dataType: "DInt"
        purpose: "Runtime of the current monitored lifecycle state in ms."
    contractRequirements:
      - "RCC-011"
      - "RCC-023"
      - "RCC-025"
      - "RCC-026"
  - blockName: "AbortAllTestSuites"
    blockType: "FC"
    category: "command"
    levels:
      - "run-control"
    support: "optional"
    purpose: "Sets the abort command of all registered suite instances."
    useWhen:
      - "Implementing direct subordinate command propagation without a provided Orchestrator."
    constraints:
      - "Use only for direct execution patterns; do not duplicate commands already generated by an Orchestrator."
    interface:
      - name: "SuiteCount"
        section: "input"
        dataType: "UInt"
        purpose: "Number of registered suite instances to abort."
    contractRequirements: []
  - blockName: "AreTestSuitesCompleted"
    blockType: "FC"
    category: "lifecycle-signals"
    levels:
      - "run-control"
    support: "required-by-pattern"
    purpose: "Returns TRUE when all configured suite control entries report completed execution."
    useWhen:
      - "Deriving aggregated subordinate lifecycle signals before a Sequencer or Orchestrator call."
    constraints: []
    interface:
      - name: "SuiteCount"
        section: "input"
        dataType: "UInt"
        purpose: "Number of registered suite entries to evaluate."
      - name: "ReturnValue"
        section: "return"
        dataType: "Bool"
        purpose: "Returns TRUE when all configured suite control entries report completed execution."
    contractRequirements:
      - "GFC-016"
      - "GFC-026"
  - blockName: "AreTestSuitesReady"
    blockType: "FC"
    category: "lifecycle-signals"
    levels:
      - "run-control"
    support: "required-by-pattern"
    purpose: "Returns TRUE when all configured suite entries have valid configuration and report ready execution."
    useWhen:
      - "Deriving aggregated subordinate lifecycle signals before a Sequencer or Orchestrator call."
    constraints: []
    interface:
      - name: "SuiteCount"
        section: "input"
        dataType: "UInt"
        purpose: "Number of registered suite entries to evaluate."
      - name: "ReturnValue"
        section: "return"
        dataType: "Bool"
        purpose: "Returns TRUE when all configured suite entries have valid configuration and report ready execution."
    contractRequirements:
      - "GFC-016"
      - "GFC-026"
  - blockName: "CheckTestSuiteArrayBounds"
    blockType: "FC"
    category: "configuration"
    levels:
      - "run-control"
    support: "optional"
    purpose: "Checks whether suite config/control arrays cover indexes 1..SuiteCount. Suite configuration content is not validated here."
    useWhen:
      - "Validating stable names, configuration values, or array bounds before lifecycle dispatch."
    constraints: []
    interface:
      - name: "SuiteCount"
        section: "input"
        dataType: "UInt"
        purpose: "Number of registered suite entries to cover."
      - name: "SuiteConfigData"
        section: "in-out"
        dataType: "Array[*] of \"UDT_UnitTestSuiteConfig\""
        purpose: "Suite configuration array to check."
      - name: "SuiteControlData"
        section: "in-out"
        dataType: "Array[*] of \"UDT_UnitTestSuiteControl\""
        purpose: "Suite control array to check."
      - name: "ReturnValue"
        section: "return"
        dataType: "Bool"
        purpose: "Checks whether suite config/control arrays cover indexes 1..SuiteCount. Suite configuration content is not validated here."
    contractRequirements: []
  - blockName: "CreateUnitTestRunControlResult"
    blockType: "FC"
    category: "result"
    levels:
      - "run-control"
    support: "required-by-pattern"
    purpose: "Creates the Run Control result from lifecycle state, previous result, optional generic results, and suite results."
    useWhen:
      - "Creating or combining stable UnitTest results in the owning block."
    constraints:
      - "Compose the final result on first entry to Completing. Retain the published owner result during later Completing and Completed calls until Reset instead of re-aggregating changing helper observations."
    interface:
      - name: "SuiteCount"
        section: "input"
        dataType: "UInt"
        purpose: "Number of registered suite instances to aggregate."
      - name: "State"
        section: "input"
        dataType: "Int"
        purpose: "Current Run Control lifecycle state."
      - name: "PreviousResult"
        section: "input"
        dataType: "Int"
        purpose: "Previous latched Run Control result."
      - name: "SequencerResult"
        section: "input"
        dataType: "Int"
        purpose: "Result reported by the Run Control sequencer, or NotEvaluated when unused."
      - name: "OrchestratorResult"
        section: "input"
        dataType: "Int"
        purpose: "Result reported by the Suite orchestrator, or NotEvaluated when unused."
      - name: "ReturnValue"
        section: "return"
        dataType: "Int"
        purpose: "Creates the Run Control result from lifecycle state, previous result, optional generic results, and suite results."
    contractRequirements:
      - "GFC-011"
      - "GFC-012"
      - "GFC-031"
      - "RCC-025"
  - blockName: "EmitRunControlFinalizationEvents"
    blockType: "FC"
    category: "event"
    levels:
      - "run-control"
    support: "required-by-pattern"
    purpose: "Emits Run Control aggregation and result events on the transition to Completing."
    useWhen:
      - "Implementing owner events or direct lifecycle behavior without duplicating finalization events."
    constraints:
      - "Call after final result composition and status publication."
      - "Do not emit duplicate owner Result, Aggregation, or Completed transition events."
    interface:
      - name: "PreviousState"
        section: "input"
        dataType: "Int"
        purpose: "State before the current owner update."
      - name: "State"
        section: "input"
        dataType: "Int"
        purpose: "Current owner state."
      - name: "ControlData"
        section: "in-out"
        dataType: "\"UDT_UnitTestRunControl\""
        purpose: "Run Control data used as event payload."
    contractRequirements:
      - "GFC-029"
      - "GFC-033"
      - "GFC-034"
      - "GFC-041"
  - blockName: "IsAbortCompleteForAllTestSuites"
    blockType: "FC"
    category: "lifecycle-signals"
    levels:
      - "run-control"
    support: "required-by-pattern"
    purpose: "Returns TRUE when all configured suite entries reached stable abort end states."
    useWhen:
      - "Deriving aggregated subordinate lifecycle signals before a Sequencer or Orchestrator call."
    constraints: []
    interface:
      - name: "SuiteCount"
        section: "input"
        dataType: "UInt"
        purpose: "Number of registered suite entries to evaluate."
      - name: "ReturnValue"
        section: "return"
        dataType: "Bool"
        purpose: "Returns TRUE when all configured suite entries reached stable abort end states."
    contractRequirements:
      - "GFC-016"
      - "GFC-026"
  - blockName: "IsResetCompleteForAllTestSuites"
    blockType: "FC"
    category: "lifecycle-signals"
    levels:
      - "run-control"
    support: "required-by-pattern"
    purpose: "Returns TRUE when all configured suite control entries report ready after reset."
    useWhen:
      - "Deriving aggregated subordinate lifecycle signals before a Sequencer or Orchestrator call."
    constraints: []
    interface:
      - name: "Reset"
        section: "input"
        dataType: "Bool"
        purpose: "TRUE while the owning run-control reset command is active in this cycle."
